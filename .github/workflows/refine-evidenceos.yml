name: Apply EvidenceOS refinement pass

on:
  push:
    branches:
      - agent/evidenceos-refinement-pass
    paths:
      - ".github/workflows/refine-evidenceos.yml"

permissions:
  contents: write

concurrency:
  group: evidenceos-refinement-pass
  cancel-in-progress: false

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout refinement branch
        uses: actions/checkout@v6
        with:
          ref: agent/evidenceos-refinement-pass
          fetch-depth: 0

      - name: Apply refinement transform
        run: python scripts/refine_evidenceos.py

      - name: Validate refined EvidenceOS
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/validate_portfolio.py
          python scripts/validate_portfolio.py
          find site/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          git diff --check

      - name: Remove one-time transform
        run: rm scripts/refine_evidenceos.py

      - name: Commit refinement pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No refinement changes were produced."
            exit 0
          fi
          git commit -m "Refine EvidenceOS architecture, network, and decision records"
          git push origin HEAD:agent/evidenceos-refinement-pass
