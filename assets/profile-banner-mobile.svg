<svg xmlns="http://www.w3.org/2000/svg" width="520" height="340" viewBox="0 0 520 340" role="img" aria-labelledby="title desc">
<title id="title">Ray Beecham | Security, quantum, and applied AI</title>
<desc id="desc">A four-qubit quantum circuit with Hadamard, CNOT, phase, and QFT gates. Photons travel each wire into a measurement meter, which flashes and flips the measured bit as each one arrives.</desc>
<style>
.photon{animation:photon 3.4s cubic-bezier(.45,0,.55,1) infinite}
.flash{opacity:0;animation:flash 3.4s ease-out infinite}
.needle{transform:rotate(-40deg);animation:needle 3.4s ease-in-out infinite}
.bitA{animation:bitA 6.8s steps(1) infinite}.bitB{opacity:0;animation:bitB 6.8s steps(1) infinite}
.cursor{animation:blink 1.1s steps(1) infinite}
@keyframes photon{0%{transform:translateX(0);opacity:0}8%,90%{opacity:1}100%{transform:translateX(298px);opacity:0}}
@keyframes flash{0%{opacity:.28}25%,100%{opacity:0}}
@keyframes needle{0%{transform:rotate(-40deg)}10%{transform:rotate(46deg)}22%{transform:rotate(28deg)}85%{transform:rotate(36deg)}100%{transform:rotate(-40deg)}}
@keyframes bitA{0%{opacity:1}50%{opacity:0}}
@keyframes bitB{0%{opacity:0}50%{opacity:1}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.photon{display:none}}
</style>
<defs>
<radialGradient id="g1" cx=".5" cy=".5" r=".55"><stop stop-color="#2a1a5e" stop-opacity=".55"/><stop offset="1" stop-color="#2a1a5e" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx=".05" cy="1" r=".6"><stop stop-color="#0c3b3a" stop-opacity=".6"/><stop offset="1" stop-color="#0c3b3a" stop-opacity="0"/></radialGradient>
<linearGradient id="qg" x2="0" y2="1"><stop stop-color="#4fe3d0"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#8ea2c8" opacity=".09"/></pattern>
<filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="520" height="340" rx="16" fill="#060a14"/>
<rect width="520" height="340" rx="16" fill="url(#dots)"/>
<rect width="520" height="340" rx="16" fill="url(#g1)"/><rect width="520" height="340" rx="16" fill="url(#g2)"/>
<rect x=".5" y=".5" width="519" height="339" rx="15.5" fill="none" stroke="#1c2540"/>
<text x="32" y="44" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="12" letter-spacing="2.5" fill="#4fe3d0">PQC · QUANTUM · APPLIED AI</text>
<text x="30" y="94" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="48" font-weight="700" fill="#f3f6ff" letter-spacing="-.8">Ray Beecham</text>
<text x="32" y="124" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="16" fill="#9aa8c3">Evidence before claims. Mission before technology.</text>
