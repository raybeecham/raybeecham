<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">EvidenceOS by Ray Beecham</title>
  <desc id="desc">Interactive mission research environment for quantum security and emerging-technology decisions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#03050d"/><stop offset=".55" stop-color="#090f22"/><stop offset="1" stop-color="#151535"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#62f2ff"/><stop offset=".55" stop-color="#9f7cff"/><stop offset="1" stop-color="#b8f45d"/></linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#62f2ff" stroke-opacity=".055"/></pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="72" y="102" fill="#62f2ff" font-size="23" letter-spacing="6">RAY BEECHAM // MISSION RESEARCH ENVIRONMENT</text>
    <text x="72" y="224" fill="#ffffff" font-size="84" font-weight="750">EvidenceOS</text>
    <text x="72" y="310" fill="#edf9ff" font-size="51" font-weight="700">Do not read the portfolio.</text>
    <text x="72" y="374" fill="url(#accent)" font-size="51" font-weight="700">Enter the decision environment.</text>
    <text x="72" y="460" fill="#aab8d3" font-size="25">Quantum security · PQC migration · quantum evaluation · research intelligence</text>
    <text x="72" y="540" fill="#b8f45d" font-size="21" font-weight="700">MISSION CONTROL  ·  DECISION REPLAY  ·  RESEARCH EARTH  ·  QUANTUM EXPLORER</text>
  </g>
  <g transform="translate(980 315)">
    <circle r="52" fill="url(#accent)" filter="url(#glow)"/>
    <circle r="10" fill="#fff"/>
    <g fill="none" stroke="url(#accent)" stroke-width="2.6" opacity=".9">
      <ellipse rx="155" ry="58"/><ellipse rx="155" ry="58" transform="rotate(60)"/><ellipse rx="155" ry="58" transform="rotate(120)"/>
      <circle r="104" stroke-dasharray="7 10" stroke-opacity=".45"/>
    </g>
    <g fill="#62f2ff"><circle cx="-140" cy="-66" r="7"/><circle cx="132" cy="-82" r="7"/><circle cx="141" cy="72" r="7"/><circle cx="-128" cy="86" r="7"/></g>
  </g>
</svg>
