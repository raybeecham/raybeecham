<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
<title id="title">Ray Beecham | Security, quantum, and applied AI</title>
<desc id="desc">A four-qubit quantum circuit with Hadamard, CNOT, phase, and QFT gates. Photons travel each wire into a measurement meter, which flashes as each one arrives and shows the next of 8 real shots measured on IBM Quantum ibm_fez on Oct 26, 2026.</desc>
<style>
.photon{animation:photon 3.4s cubic-bezier(.45,0,.55,1) infinite}
.flash{opacity:0;animation:flash 3.4s ease-out infinite}
.needle{transform:rotate(-40deg);animation:needle 3.4s ease-in-out infinite}
.shot{opacity:0;animation-name:shot;animation-timing-function:steps(1);animation-iteration-count:infinite}
.cursor{animation:blink 1.1s steps(1) infinite}
@keyframes photon{0%{transform:translateX(0);opacity:0}8%,90%{opacity:1}100%{transform:translateX(298px);opacity:0}}
@keyframes flash{0%{opacity:.28}25%,100%{opacity:0}}
@keyframes needle{0%{transform:rotate(-40deg)}10%{transform:rotate(46deg)}22%{transform:rotate(28deg)}85%{transform:rotate(36deg)}100%{transform:rotate(-40deg)}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.photon{display:none}.s0{opacity:1}}
</style><style>@keyframes shot{0%{opacity:1}12.500%,100%{opacity:0}}</style>
<defs>
<radialGradient id="g1" cx=".8" cy=".5" r=".55"><stop stop-color="#2a1a5e" stop-opacity=".55"/><stop offset="1" stop-color="#2a1a5e" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx=".05" cy="1" r=".6"><stop stop-color="#0c3b3a" stop-opacity=".6"/><stop offset="1" stop-color="#0c3b3a" stop-opacity="0"/></radialGradient>
<linearGradient id="qg" x2="0" y2="1"><stop stop-color="#4fe3d0"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#8ea2c8" opacity=".09"/></pattern>
<filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1000" height="300" rx="16" fill="#060a14"/>
<rect width="1000" height="300" rx="16" fill="url(#dots)"/>
<rect width="1000" height="300" rx="16" fill="url(#g1)"/><rect width="1000" height="300" rx="16" fill="url(#g2)"/>
<rect x=".5" y=".5" width="999" height="299" rx="15.5" fill="none" stroke="#1c2540"/>
<text x="48" y="82" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="13" letter-spacing="3" fill="#4fe3d0">PQC · QUANTUM · APPLIED AI</text>
<text x="45" y="156" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="68" font-weight="700" fill="#f3f6ff" letter-spacing="-1">Ray Beecham</text>
<text x="48" y="199" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="19" fill="#9aa8c3">Evidence before claims. Mission before technology.</text>
