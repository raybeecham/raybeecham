name: Apply one-time portfolio cleanup

on:
  push:
    branches:
      - agent/portfolio-cleanup-v1
    paths:
      - "scripts/refactor_portfolio.py"
      - ".github/workflows/portfolio-cleanup.yml"

permissions:
  contents: write

concurrency:
  group: portfolio-cleanup-v1
  cancel-in-progress: false

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v6
        with:
          ref: agent/portfolio-cleanup-v1
          fetch-depth: 0

      - name: Apply structural cleanup
        run: python scripts/refactor_portfolio.py

      - name: Validate cleaned portfolio
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_portfolio.py
          find site/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Remove one-time refactor machinery
        run: |
          rm scripts/refactor_portfolio.py
          rm .github/workflows/portfolio-cleanup.yml

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes were produced."
            exit 0
          fi
          git commit -m "Refactor portfolio structure and validation"
          git push origin HEAD:agent/portfolio-cleanup-v1
