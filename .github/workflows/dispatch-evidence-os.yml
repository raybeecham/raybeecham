name: Dispatch EvidenceOS mission control build

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened

permissions:
  contents: write

jobs:
  build-branch:
    if: github.head_ref == 'agent/evidenceos-mission-control'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout EvidenceOS branch
        uses: actions/checkout@v6
        with:
          ref: agent/evidenceos-mission-control
          fetch-depth: 0

      - name: Apply EvidenceOS payload
        run: python scripts/apply_evidence_os_payload.py

      - name: Validate EvidenceOS
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/validate_portfolio.py
          python scripts/validate_portfolio.py
          find site/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Remove one-time builder
        run: rm scripts/apply_evidence_os_payload.py

      - name: Commit EvidenceOS
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build EvidenceOS mission control experience"
          git push origin HEAD:agent/evidenceos-mission-control
