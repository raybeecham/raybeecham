name: Apply EvidenceOS experience refinement v2

on:
  push:
    branches:
      - agent/evidenceos-refinement-pass
    paths:
      - ".github/workflows/apply-evidenceos-experience-v2.yml"

permissions:
  contents: write

concurrency:
  group: evidenceos-experience-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout refinement branch
        uses: actions/checkout@v6
        with:
          ref: agent/evidenceos-refinement-pass
          fetch-depth: 0

      - name: Wire experience refinement
        run: python scripts/apply_evidenceos_experience_v2.py

      - name: Validate complete EvidenceOS experience
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/validate_portfolio.py
          python scripts/validate_portfolio.py
          find site/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          git diff --check

      - name: Remove one-time wiring script
        run: rm scripts/apply_evidenceos_experience_v2.py

      - name: Commit experience refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine EvidenceOS interaction, network density, and final routing"
          git push origin HEAD:agent/evidenceos-refinement-pass
