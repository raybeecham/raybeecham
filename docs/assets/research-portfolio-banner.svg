<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Open Ray Beecham's interactive research portfolio</title>
  <desc id="desc">A dark quantum-security banner with an evidence core connected to post-quantum cryptography, applied quantum systems, AI engineering, and technology decision assurance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset=".55" stop-color="#0b1024"/><stop offset="1" stop-color="#111733"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#62f2ff"/><stop offset=".52" stop-color="#8b5cf6"/><stop offset="1" stop-color="#b8f45d"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#62f2ff" stop-opacity=".38"/><stop offset="1" stop-color="#62f2ff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#62f2ff" stroke-opacity=".055"/></pattern>
    <filter id="soft" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="25" fill="none" stroke="url(#accent)" stroke-opacity=".52"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)"/>
  <circle cx="974" cy="180" r="165" fill="url(#glow)"/>
  <g fill="#eafcff" font-family="Segoe UI, Arial, sans-serif">
    <text x="54" y="72" font-size="19" letter-spacing="4" fill="#62f2ff">INTERACTIVE RESEARCH PORTFOLIO</text>
    <text x="54" y="145" font-size="48" font-weight="700">Evidence-first systems for</text>
    <text x="54" y="202" font-size="48" font-weight="700">quantum security and mission decisions.</text>
    <text x="54" y="257" font-size="22" fill="#aeb9d8">PQC · applied quantum · AI systems engineering · technology decision assurance</text>
    <text x="54" y="318" font-size="21" font-weight="700" fill="#b8f45d">ENTER THE PORTFOLIO  →</text>
  </g>
  <g transform="translate(970 180)">
    <circle r="34" fill="url(#accent)" filter="url(#soft)"/>
    <circle r="8" fill="#fff"/>
    <g fill="none" stroke="url(#accent)" stroke-width="2.2" opacity=".9">
      <ellipse rx="142" ry="54"/><ellipse rx="142" ry="54" transform="rotate(60)"/><ellipse rx="142" ry="54" transform="rotate(120)"/>
      <circle r="78" stroke-opacity=".38"/>
    </g>
    <g fill="#62f2ff"><circle cx="-126" cy="-65" r="6"/><circle cx="119" cy="-75" r="6"/><circle cx="126" cy="68" r="6"/><circle cx="-117" cy="78" r="6"/></g>
  </g>
</svg>
