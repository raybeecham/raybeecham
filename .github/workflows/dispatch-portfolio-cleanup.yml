name: Dispatch portfolio cleanup branch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened

permissions:
  contents: write

jobs:
  refactor-branch:
    if: github.head_ref == 'agent/portfolio-cleanup-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v6
        with:
          ref: agent/portfolio-cleanup-v1
          fetch-depth: 0

      - name: Apply structural cleanup
        run: |
          python scripts/refactor_portfolio.py
          python scripts/post_refactor_cleanup.py

      - name: Validate cleaned portfolio
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_portfolio.py
          find site/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Restore workflow paths for connector-managed follow-up
        run: git checkout origin/main -- .github/workflows/deploy-portfolio.yml

      - name: Remove branch-only Python refactor machinery
        run: |
          rm scripts/refactor_portfolio.py
          rm scripts/post_refactor_cleanup.py

      - name: Commit cleanup branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor portfolio structure and validation"
          git push origin HEAD:agent/portfolio-cleanup-v1
