name: Apply EvidenceOS timeline alignment

on:
  push:
    branches:
      - agent/evidenceos-refinement-pass
    paths:
      - ".github/workflows/apply-timeline-alignment.yml"

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout refinement branch
        uses: actions/checkout@v6
        with:
          ref: agent/evidenceos-refinement-pass
          fetch-depth: 0

      - name: Wire timeline alignment
        run: python scripts/apply_timeline_alignment.py

      - name: Validate EvidenceOS
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/validate_portfolio.py
          python scripts/validate_portfolio.py
          find site/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          git diff --check

      - name: Remove one-time wiring script
        run: rm scripts/apply_timeline_alignment.py

      - name: Commit timeline alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align EvidenceOS timeline rail and milestones"
          git push origin HEAD:agent/evidenceos-refinement-pass
