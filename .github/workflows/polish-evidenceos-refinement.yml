name: Polish EvidenceOS refinement

on:
  push:
    branches:
      - agent/evidenceos-refinement-pass
    paths:
      - ".github/workflows/polish-evidenceos-refinement.yml"

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout refinement branch
        uses: actions/checkout@v6
        with:
          ref: agent/evidenceos-refinement-pass
          fetch-depth: 0

      - name: Apply terminology and UX polish
        run: python scripts/polish_evidenceos_refinement.py

      - name: Validate polished EvidenceOS
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/validate_portfolio.py
          python scripts/validate_portfolio.py
          find site/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          git diff --check

      - name: Remove one-time polish script
        run: rm scripts/polish_evidenceos_refinement.py

      - name: Commit polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish EvidenceOS terminology and decision-record presentation"
          git push origin HEAD:agent/evidenceos-refinement-pass
